server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy the API and health probes to the backend service (compose service
    # name "backend", per docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://backend:8080/readyz;
        proxy_set_header Host $host;
    }

    # SPA fallback for react-router client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
