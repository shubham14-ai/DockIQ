# DockIQ — Phase 0 control-plane stack
# Usage:
#   docker compose up -d --build          # start control plane
#   docker compose --profile agent up -d  # also run a local test agent
name: dockiq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dockiq
      POSTGRES_PASSWORD: dockiq
      POSTGRES_DB: dockiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockiq"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.102.1
    command:
      - "--storageDataPath=/vmdata"
      - "--retentionPeriod=15d"
      - "--httpListenAddr=:8428"
    volumes:
      - vmdata:/vmdata
    ports:
      - "8428:8428"

  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./deploy/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - victoriametrics
      - loki

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://dockiq:dockiq@postgres:5432/dockiq
      NATS_URL: nats://nats:4222
      NATS_ADVERTISE_URL: nats://nats:4222
      # Diagnostic Query Agent (Engine 11). Empty → feature returns "not configured".
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DIAGNOSTIC_MODEL: ${DIAGNOSTIC_MODEL:-claude-opus-5}
      # Auth / RBAC (Phase 7)
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      AGENT_JOIN_TOKEN: ${AGENT_JOIN_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "5175:80"      # http://localhost:5173  (nginx proxies /api → backend:8080)
    depends_on:
      - backend

  # Local test agent (opt-in). Runs on this host, shares the compose network.
  #   docker compose --profile agent up -d agent
  agent:
    build: ./agent
    profiles: ["agent"]
    restart: unless-stopped
    environment:
      CONTROL_PLANE_URL: http://backend:8080
      HOST_NAME: ${HOST_NAME:-local-docker-host}
      DOCKIQ_JOIN_TOKEN: ${AGENT_JOIN_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backend

volumes:
  pgdata: {}
  vmdata: {}
  lokidata: {}
  grafanadata: {}
